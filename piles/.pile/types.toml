version = "gitpile/1"

[[node-types]]
name = "external"
title = "something outside the repository that a pile relies on"

[[edge-types]]
name = "relies-on"
title = "one pile relies on what another is for"
source = ["pile"]
target = ["pile", "external"]
do = "say what the source relies on, in words of the target's intent"
dont = "name a file or a path"
